# Cut a release from a `v<version>` tag.
#
# Every binary is built on a runner of its own platform: the macOS builds on
# macOS, the aarch64 Linux build on an aarch64 runner, the Windows build on
# Windows. Zig could cross-compile the lot from one machine in a third of the
# wall clock, and an earlier version of this file did — but then nothing is ever
# *run* before it is published, and "it linked" is a much weaker claim than "it
# printed its version on the machine it was built for". The jobs run in
# parallel, so the honest way is not the slow way.
#
# Windows is a first-class target here. Julia's users are Windows users more
# often than not.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  ZIG_VERSION: 0.16.0

jobs:
  version:
    name: tag matches build.zig.zon
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      # `build.zig.zon` is the only place the version is written; `build.zig`
      # passes it through `build_options` and `ajt version` prints it. So there
      # is exactly one string to agree with, and this is where the tag has to
      # agree with it — before anything is built or published.
      - id: check
        run: |
          set -euo pipefail
          tag='${{ github.event.inputs.tag || github.ref_name }}'
          manifest=$(sed -n 's/^[[:space:]]*\.version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' build.zig.zon | head -1)
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "v$manifest" ]; then
            echo "::error::tag $tag does not match build.zig.zon version $manifest (expected v$manifest)"
            exit 1
          fi
          # The wrapper package ships in the same tag, so it moves in lockstep.
          wrapper=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' julia/Project.toml | head -1)
          if [ "$wrapper" != "$manifest" ]; then
            echo "::error::julia/Project.toml version $wrapper does not match build.zig.zon $manifest"
            exit 1
          fi
          echo "version=$manifest" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }} on ${{ matrix.runner }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux-musl, runner: ubuntu-latest }
          - { target: aarch64-linux-musl, runner: ubuntu-24.04-arm }
          - { target: x86_64-macos, runner: macos-13 }
          - { target: aarch64-macos, runner: macos-14 }
          - { target: x86_64-windows-gnu, runner: windows-latest }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      # One target, packaged both ways, with a `<target>.hashes` fragment for
      # the assemble job. The script decides which targets link libgit2 and
      # which licences travel with them.
      - name: Build and package
        run: julia --project=julia packaging/gen_artifacts.jl --target ${{ matrix.target }} --out dist

      # The point of building here rather than cross-compiling: unpack exactly
      # what a user would download, on the platform they would download it for,
      # and run it.
      - name: Unpack and run it
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          tar -xzf "dist/ajt-$VERSION-$TARGET.tar.gz"
          dir="ajt-$VERSION-$TARGET"
          bin="$dir/bin/ajt"
          [ -f "$bin" ] || bin="$dir/bin/ajt.exe"
          "$bin" help > /dev/null
          printed=$("$bin" version)
          echo "$printed"
          if [ "$printed" != "ajt $VERSION" ]; then
            echo "::error::ajt version printed '$printed', expected 'ajt $VERSION'"
            exit 1
          fi
          test -f "$dir/share/licenses/Ajt/LICENSE"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    name: assemble and publish
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      # The fragments each runner produced become one `Artifacts.toml`. No
      # binary is built here — this job only reads hashes the builders computed
      # from the bytes they are about to publish.
      - name: Assemble Artifacts.toml
        run: julia --project=julia packaging/gen_artifacts.jl --assemble --out dist

      # `Artifacts.toml` ships *inside* the registered package, so it has to be
      # committed before the version is registered — and it can only be written
      # after the binaries exist. That ordering cannot be collapsed, so it is
      # surfaced rather than hidden: the file is published with the release, and
      # if the copy in the repository does not already match, the job says so
      # and shows the diff. It does not fail; the binaries are good, and they
      # are what this tag is for.
      - name: Report Artifacts.toml
        run: |
          set -euo pipefail
          cp julia/Artifacts.toml dist/Artifacts.toml
          if git diff --quiet -- julia/Artifacts.toml; then
            echo "### Artifacts.toml is current" >> "$GITHUB_STEP_SUMMARY"
            echo "The committed file already describes these binaries." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::julia/Artifacts.toml changed — commit it before registering this version"
            {
              echo "### Commit the new \`julia/Artifacts.toml\`"
              echo
              echo "It is attached to this release and describes the binaries just published."
              echo "Register only from a commit that contains it, or \`add Ajt\` resolves to"
              echo "hashes nothing was published under."
              echo
              echo '```diff'
              git diff -- julia/Artifacts.toml | head -120
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          rm -f dist/*.hashes
          ls -l dist
          # Idempotent on re-run: a release that already exists gets its assets
          # replaced rather than a second release appearing next to it.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "ajt $TAG" \
              --generate-notes
          fi
